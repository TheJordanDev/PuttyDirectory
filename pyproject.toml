[project]
name = "puttydirectory"
version = "0.2.0"
description = "A hierarchical session manager that launches PuTTY"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.3.0",
    "pystray>=0.19.5",
    # The Linux tray speaks StatusNotifierItem over D-Bus (see
    # puttydirectory/sni.py); jeepney is a pure-Python D-Bus client, so it needs
    # no system packages and freezes cleanly.
    "jeepney>=0.9.0; sys_platform == 'linux'",
    # Only for the XEmbed fallback on desktops with no SNI host.
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.scripts]
puttydirectory = "puttydirectory.cli:main"

[tool.setuptools]
packages = ["puttydirectory"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
